<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0a00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teen Donut — انبار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0a00;--bg2:#1a1200;--bg3:#221800;--card:#1e1500;
  --border:#2d2000;--gold:#e8a020;
  --text:#f5ede0;--text2:#a08060;--text3:#604030;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6
}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto}
/* AUTH */
#authScreen{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.auth-logo{font-size:52px;margin-bottom:8px}
.auth-brand{font-size:10px;color:var(--gold);letter-spacing:4px;text-transform:uppercase;margin-bottom:4px;text-align:center}
.auth-subtitle{font-size:13px;color:var(--text2);margin-bottom:36px;text-align:center}
.auth-tabs{display:flex;margin-bottom:24px;background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;width:100%}
.auth-tab{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.auth-tab.active{background:var(--bg3);color:var(--gold)}
.auth-form{width:100%;display:flex;flex-direction:column;gap:14px}
.auth-field-label{font-size:12px;color:var(--text2);margin-bottom:5px}
.auth-input{width:100%;padding:13px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;box-sizing:border-box}
.auth-input:focus{border-color:var(--gold)}
.auth-btn{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--gold);color:#0f0a00;margin-top:4px}
.auth-msg{text-align:center;font-size:13px;padding:10px;border-radius:10px;min-height:18px}
.auth-msg.error{background:#2d0a0a;color:#fca5a5}
.auth-msg.pending{background:#1a1200;color:#f59e0b;border:1px solid #f59e0b44}
.auth-msg.success{background:#052e16;color:#86efac}
/* APP */
#appScreen{display:none}
.header{background:linear-gradient(160deg,#1a0f00,#2a1800);padding:18px 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header-brand{font-size:10px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
.header-title{font-size:20px;font-weight:800}
.alert-bar{margin-top:10px;background:#2d1500;border:1px solid #f59e0b44;border-radius:10px;padding:8px 12px;font-size:12px;color:#fbbf24;display:flex;align-items:center;gap:6px;cursor:pointer}
.content{padding:16px 16px 90px}
.page-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.page-tabs::-webkit-scrollbar{display:none}
.ptab{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.ptab.active{border-color:var(--gold);background:var(--bg3);color:var(--gold)}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.filter-btn.active{border-color:var(--gold);background:var(--bg3);color:var(--gold)}
.items-list{display:flex;flex-direction:column;gap:10px}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.item-card.low{border-color:#f59e0b66}
.item-card.empty{border-color:#ef444466}
.item-accent{position:absolute;right:0;top:0;bottom:0;width:3px}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer}
.item-name{font-weight:700;font-size:15px;margin-bottom:3px}
.item-cat{font-size:11px;color:var(--text2)}
.item-qty{font-size:26px;font-weight:800;line-height:1}
.item-unit{font-size:11px;color:var(--text2);margin-top:2px}
.item-actions{display:flex;gap:6px;margin-top:10px}
.item-action-btn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.item-action-btn.tx{border-color:#e8a02044;color:var(--gold)}
.item-action-btn.edit{border-color:#3b82f644;color:#3b82f6}
.item-action-btn.del{border-color:#ef444433;color:#ef4444}
.progress-wrap{margin-top:10px;height:3px;background:var(--border);border-radius:4px}
.progress-bar{height:100%;border-radius:4px}
.item-min{font-size:10px;color:var(--text3);margin-top:4px}
.back-btn{background:none;border:none;color:var(--gold);font-size:14px;cursor:pointer;margin-bottom:20px;padding:0;font-family:inherit;display:block}
.tx-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;text-align:center}
.tx-item-name{font-size:13px;color:var(--text2);margin-bottom:4px}
.tx-qty{font-size:44px;font-weight:800;line-height:1}
.tx-unit{color:var(--text2);font-size:13px;margin-top:4px}
.type-toggle{display:flex;gap:8px;margin-bottom:20px}
.type-btn{flex:1;padding:12px;border-radius:12px;border:2px solid var(--border);background:transparent;color:var(--text2);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.type-btn.in.active{border-color:var(--green);background:#052e16;color:var(--green)}
.type-btn.out.active{border-color:var(--red);background:#2d0a0a;color:var(--red)}
.field-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.field-wrap{margin-bottom:14px}
.field-input{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;font-family:inherit;text-align:center;outline:none;box-sizing:border-box}
.field-input:focus{border-color:var(--gold)}
.field-input.small{font-size:14px;text-align:right}
.submit-btn{width:100%;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.submit-btn.green{background:#16a34a;color:white}
.submit-btn.red{background:#dc2626;color:white}
.submit-btn.gold{background:var(--gold);color:#0f0a00}
.submit-btn.blue{background:#2563eb;color:white}
.section-title{font-size:18px;font-weight:800;margin-bottom:20px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cat-btn{padding:10px 6px;border-radius:10px;border:2px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.6}
/* CHECKLIST */
.add-check-row{display:flex;gap:8px;margin-bottom:16px}
.add-check-input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.add-check-input:focus{border-color:var(--gold)}
.add-check-btn{padding:10px 16px;background:var(--gold);border:none;border-radius:12px;color:#0f0a00;font-size:18px;font-weight:700;cursor:pointer}
.check-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.check-item.done{opacity:.5}
.check-circle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.check-circle.done{background:var(--green);border-color:var(--green);color:white}
.check-text{flex:1;font-size:14px}
.check-text.done{text-decoration:line-through;color:var(--text2)}
.check-del{font-size:16px;color:var(--text3);padding:4px;background:none;border:none;cursor:pointer}
.checklist-progress{margin-bottom:16px}
.checklist-progress-text{font-size:12px;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between}
.checklist-bar-wrap{height:4px;background:var(--border);border-radius:4px}
.checklist-bar{height:100%;background:var(--green);border-radius:4px}
.clear-done-btn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;margin-top:12px}
/* SMART CHECKLIST */
.smart-list-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.smart-list-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer}
.smart-list-title{font-weight:700;font-size:14px}
.smart-list-meta{font-size:11px;color:var(--text2);margin-top:2px}
.smart-list-actions{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border)}
.sla-btn{flex:1;padding:8px;border-radius:10px;border:1px solid;background:transparent;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.sla-btn.view{border-color:#3b82f644;color:#3b82f6}
.sla-btn.edit{border-color:#e8a02044;color:var(--gold)}
.sla-btn.exec{border-color:#22c55e44;color:#22c55e}
.cat-section{margin-bottom:16px}
.cat-section-title{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:8px;padding-right:4px}
.smart-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:6px;cursor:pointer}
.smart-item.checked .smart-circle{background:var(--green);border-color:var(--green);color:white}
.smart-item.checked .smart-name{color:var(--text2)}
.smart-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.smart-name{flex:1;font-size:14px}
.smart-qty{font-size:11px;color:var(--text2)}
/* EXEC */
.exec-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.exec-item-name{font-weight:700;font-size:15px;margin-bottom:4px}
.exec-item-stock{font-size:12px;color:var(--text2);margin-bottom:10px}
/* ADMIN */
.admin-filters{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.admin-filter-row{display:flex;gap:8px}
.admin-search{width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.admin-search:focus{border-color:var(--gold)}
.date-input{flex:1;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.admin-type-filter{display:flex;gap:6px}
.atype-btn{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.atype-btn.active{border-color:var(--gold);color:var(--gold);background:var(--bg3)}
.admin-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.summary-num{font-size:22px;font-weight:800}
.summary-label{font-size:11px;color:var(--text2);margin-top:2px}
.admin-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.admin-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.admin-item-name{font-weight:700;font-size:14px}
.admin-item-delta{font-size:16px;font-weight:800}
.admin-item-meta{display:flex;gap:10px;font-size:11px;color:var(--text2);flex-wrap:wrap}
.admin-item-note{font-size:11px;color:var(--text2);margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge.in{background:#052e16;color:#22c55e}
.badge.out{background:#2d0a0a;color:#ef4444}
.badge.list{background:#1e1a40;color:#818cf8}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:#000000bb;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#1e1500;border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:340px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:8px}
.modal-text{font-size:13px;color:var(--text2);margin-bottom:20px}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-btn.cancel{background:var(--bg3);color:var(--text2)}
.modal-btn.confirm{background:#dc2626;color:white}
.modal-btn.save{background:var(--gold);color:#0f0a00}
/* NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#141000;border-top:1px solid var(--border);display:flex;padding:10px 0 22px;z-index:20}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;padding:6px 0}
.nav-btn .nav-icon{font-size:20px}
.nav-btn .nav-label{font-size:10px;color:var(--text3)}
.nav-btn.active .nav-label{color:var(--gold)}
/* MISC */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:30px;font-size:13px;font-weight:700;z-index:100;white-space:nowrap;pointer-events:none;animation:toastIn .2s ease}
.toast.success{background:#052e16;border:1px solid #22c55e44;color:#86efac}
.toast.error{background:#2d0a0a;border:1px solid #ef444444;color:#fca5a5}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.loading{display:flex;align-items:center;justify-content:center;padding:40px 0}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;color:var(--text3);padding:40px 0;font-size:14px}
.logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit}
/* USERS */
.user-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.user-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.user-name-big{font-size:15px;font-weight:800}
.ubadge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.ubadge.active{background:#052e16;color:#22c55e}
.ubadge.pending{background:#2d1500;color:#f59e0b}
.ubadge.disabled{background:#2d0a0a;color:#ef4444}
.user-meta{font-size:11px;color:var(--text2);margin-bottom:10px}
.user-actions{display:flex;gap:8px}
.user-action-btn{flex:1;padding:8px;border-radius:10px;border:1px solid;background:transparent;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.user-action-btn.approve{border-color:#22c55e44;color:#22c55e}
.user-action-btn.deactivate{border-color:#ef444433;color:#ef4444}
.user-action-btn.reactivate{border-color:#3b82f644;color:#3b82f6}
.pending-badge{background:#dc2626;color:white;border-radius:50%;width:16px;height:16px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:3px}
.admin-section-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.admin-section-tabs::-webkit-scrollbar{display:none}
.ast-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.ast-btn.active{border-color:var(--gold);color:var(--gold);background:var(--bg3)}
.users-filter{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.users-filter::-webkit-scrollbar{display:none}
.ufilter-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.ufilter-btn.active{border-color:var(--gold);color:var(--gold);background:var(--bg3)}
.build-tab{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.build-tab.active{border-color:var(--gold);background:var(--bg3);color:var(--gold)}

.warn-card{background:var(--card);border:1px solid #f59e0b44;border-radius:14px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.warn-card.empty{border-color:#ef444444}
.warn-accent{position:absolute;right:0;top:0;bottom:0;width:3px}
.warn-name{font-weight:700;font-size:15px;margin-bottom:2px}
.warn-row{display:flex;justify-content:space-between;align-items:center}
.warn-qty{font-size:22px;font-weight:800}
.warn-info{font-size:11px;color:var(--text2);margin-top:4px}
</style>
</head>
<body>

<div id="authScreen" style="display:flex">
  <div class="auth-logo">🍩</div>
  <div class="auth-brand">Teen Donut</div>
  <div class="auth-subtitle">سیستم انبارداری</div>
  <div class="auth-tabs">
    <button class="auth-tab active" id="tabLogin">ورود</button>
    <button class="auth-tab" id="tabRegister">ثبت‌نام</button>
  </div>
  <div class="auth-form" id="authForm">
    <div><div class="auth-field-label">نام کاربری</div>
      <input class="auth-input" type="text" id="loginUser" placeholder="نام کاربری" autocomplete="username"></div>
    <div><div class="auth-field-label">رمز عبور</div>
      <input class="auth-input" type="password" id="loginPass" placeholder="رمز عبور" autocomplete="current-password"></div>
    <div id="authMsg" class="auth-msg"></div>
    <button class="auth-btn" id="loginBtn">ورود به سیستم</button>
  </div>
</div>

<div id="appScreen">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-brand">Teen Donut</div>
        <div class="header-title" id="headerTitle">انبارداری</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:var(--text2)" id="userLabel"></span>
        <button class="logout-btn" id="logoutBtn">خروج</button>
        <div style="font-size:28px">🍩</div>
      </div>
    </div>
    <div class="alert-bar" id="alertBar" style="display:none">
      <span>⚠️</span><span id="alertText"></span>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="inventory"><span class="nav-icon">📋</span><span class="nav-label">موجودی</span></button>
    <button class="nav-btn" data-view="warning"><span class="nav-icon">⚠️</span><span class="nav-label" id="warnNavLabel">هشدار</span></button>
    <button class="nav-btn" data-view="editItems"><span class="nav-icon">✏️</span><span class="nav-label">ویرایش</span></button>
    <button class="nav-btn" data-view="checklist"><span class="nav-icon">✅</span><span class="nav-label">لیست روزانه</span></button>
    <button class="nav-btn" data-view="add"><span class="nav-icon">➕</span><span class="nav-label">اضافه کن</span></button>
    <button class="nav-btn" id="nav-admin" data-view="admin" style="display:none"><span class="nav-icon">📊</span><span class="nav-label" id="adminNavLabel">مدیریت</span></button>
  </nav>
</div>

<script>
const FB_URL='https://teen-donut-29057-default-rtdb.firebaseio.com';
const FB_KEY='AIzaSyDHvkCH-H5frnp53Pk9W66DDaMwbATKfac';

const FB={
  async get(p){const r=await fetch(`${FB_URL}/${p}.json`);return r.json()},
  async set(p,d){const r=await fetch(`${FB_URL}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.json()},
  async push(p,d){const r=await fetch(`${FB_URL}/${p}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.json()},
  async update(p,d){const r=await fetch(`${FB_URL}/${p}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.json()},
  async remove(p){await fetch(`${FB_URL}/${p}.json`,{method:'DELETE'})},
  listen(path,cb){
    let last=undefined;
    async function poll(){
      try{const d=await FB.get(path);const s=JSON.stringify(d);if(s!==last){last=s;cb(d);}}catch(e){}
    }
    poll();const id=setInterval(poll,3000);return{close:()=>clearInterval(id)};
  }
};

async function doLogin(){
  const u=(document.getElementById('loginUser')?.value||'').trim().toLowerCase();
  const p=(document.getElementById('loginPass')?.value||'').trim();
  if(!u||!p){showAuthMsg('نام کاربری و رمز رو وارد کن','error');return;}
  if(u===ADMIN_USER&&p===ADMIN_PASS){currentUser={username:ADMIN_USER,role:'admin'};enterApp();return;}
  try{
    const ud=await FB.get('users/'+u);
    if(!ud){showAuthMsg('نام کاربری یا رمز اشتباه است','error');return;}
    if(ud.password!==p){showAuthMsg('نام کاربری یا رمز اشتباه است','error');return;}
    if(ud.status==='pending'){showAuthMsg('حسابت هنوز تایید نشده — صبر کن 🕐','pending');return;}
    if(ud.status==='disabled'){showAuthMsg('حساب غیرفعال شده. با ادمین تماس بگیر.','error');return;}
    currentUser={username:u,role:'user'};enterApp();
  }catch(e){showAuthMsg('خطا در اتصال به سرور','error');}
}
async function doRegister(){
  const u=(document.getElementById('regUser')?.value||'').trim().toLowerCase();
  const p=(document.getElementById('regPass')?.value||'').trim();
  if(!u||!p){showAuthMsg('همه فیلدها رو پر کن','error');return;}
  if(u===ADMIN_USER){showAuthMsg('این نام کاربری قابل استفاده نیست','error');return;}
  if(u.length<3){showAuthMsg('نام کاربری باید حداقل ۳ کاراکتر باشه','error');return;}
  if(p.length<4){showAuthMsg('رمز باید حداقل ۴ کاراکتر باشه','error');return;}
  if(/[^a-z0-9_]/.test(u)){showAuthMsg('فقط حروف انگلیسی کوچک، عدد و _ مجاز است','error');return;}
  try{
    const ex=await FB.get('users/'+u);
    if(ex){showAuthMsg('این نام کاربری قبلاً ثبت شده','error');return;}
    await FB.set('users/'+u,{password:p,status:'pending',createdAt:Date.now()});
    showAuthMsg('ثبت‌نام موفق ✓ — منتظر تایید ادمین بمون 🕐','pending');
  }catch(e){showAuthMsg('خطا در اتصال به سرور','error');}
}

  const CATS=allCats();

  c.innerHTML=`

    <button class="submit-btn ${txType==='in'?'green':'red'}" id="txSub">${txType==='in'?'ثبت ورود':'ثبت خروج'}</button>`;
  document.getElementById('txBack').onclick=()=>navigate('inventory');
  document.getElementById('btnIn').onclick=()=>{txType='in';document.getElementById('btnIn').className='type-btn in active';document.getElementById('btnOut').className='type-btn out';const b=document.getElementById('txSub');b.className='submit-btn green';b.textContent='ثبت ورود';};

  document.getElementById('txSub').onclick=async()=>{

    const note=document.getElementById('txNote')?.value||'';

    const newQty=txType==='in'?item.quantity+qty:Math.max(0,item.quantity-qty);
    await FB.update('items/'+selectedItemId,{quantity:newQty});
    await FB.push('history',{itemId:selectedItemId,itemName:item.name,unit:item.unit,type:txType,qty,note,user:currentUser?.username||'?',date:persianDateTime(),ts:Date.now()});
    logActivity(txType==='in'?'ورود موجودی':'خروج موجودی',`${item.name}: ${txType==='in'?'+':'-'}${qty} ${item.unit}${note?' — '+note:''}`);
    showToast(txType==='in'?`${qty} ${item.unit} اضافه شد ✓`:`${qty} ${item.unit} کم شد ✓`);
    navigate('inventory');
  };
}

function buildCatBtns(selId){
  const CATS=allCats();
  const sel=document.getElementById(selId);if(!sel)return;sel.innerHTML='';
  for(const [k,v] of Object.entries(CATS)){
    const btn=document.createElement('button');btn.className='cat-btn';
    btn.innerHTML=`${v.icon}<br>${v.label}`;
    if(newCat===k)btn.style.cssText=`border-color:${v.color};color:${v.color};background:var(--bg3)`;
    btn.onclick=()=>{newCat=k;buildCatBtns(selId);};
    sel.appendChild(btn);

}

function renderChecklist(){
  const c=document.getElementById('mainContent');
  let html=`<div class="page-tabs">
    <button class="ptab ${checklistTab==='daily'?'active':''}" data-ctab="daily">✅ لیست روزانه</button>
    <button class="ptab ${checklistTab==='outgoing'?'active':''}" data-ctab="outgoing">📦 لیست انبار</button>
    <button class="ptab ${checklistTab==='incoming'?'active':''}" data-ctab="incoming">📥 ورودی</button>
  </div>`;
  c.innerHTML=html;
  c.querySelectorAll('[data-ctab]').forEach(b=>b.onclick=()=>{checklistTab=b.dataset.ctab;renderChecklist();});

  const sub=document.createElement('div');

function renderDailyChecklist(c){
  const entries=Object.entries(checklist);
  const done=entries.filter(([,v])=>v.done).length,total=entries.length;
  const progress=total>0?Math.round((done/total)*100):0;
  let html='';
  if(total>0)html+=`<div class="checklist-progress"><div class="checklist-progress-text"><span>پیشرفت امروز</span><span>${done} از ${total}</span></div><div class="checklist-bar-wrap"><div class="checklist-bar" style="width:${progress}%"></div></div></div>`;
  html+=`<div class="add-check-row"><input class="add-check-input" type="text" id="checkInput" placeholder="مثلاً: آرد ۵ کیلو"><button class="add-check-btn" id="addCkBtn">+</button></div>`;
  if(!entries.length)html+=`<div class="empty-state" style="padding:20px 0">لیست امروز خالیه</div>`;
  else{
    for(const [key,item] of entries)
      html+=`<div class="check-item ${item.done?'done':''}" data-ck="${key}"><div class="check-circle ${item.done?'done':''}">${item.done?'✓':''}</div><div class="check-text ${item.done?'done':''}">${item.text}</div><button class="check-del" data-dck="${key}">✕</button></div>`;
    if(done>0)html+=`<button class="clear-done-btn" id="clrDone">حذف تیک‌خورده‌ها</button>`;
  }
  c.innerHTML=html;
  const addFn=()=>{const inp=document.getElementById('checkInput'),txt=inp?.value.trim();if(!txt)return;FB.push('checklist/'+todayKey(),{text:txt,done:false});inp.value='';showToast('اضافه شد ✓');};
  document.getElementById('addCkBtn').onclick=addFn;
  document.getElementById('checkInput').onkeydown=e=>{if(e.key==='Enter')addFn();};
  const cd=document.getElementById('clrDone');
  if(cd)cd.onclick=()=>{entries.filter(([,v])=>v.done).forEach(([k])=>FB.remove('checklist/'+todayKey()+'/'+k));showToast('پاک شد ✓');};
  c.querySelectorAll('[data-ck]').forEach(el=>el.onclick=()=>FB.update('checklist/'+todayKey()+'/'+el.dataset.ck,{done:!checklist[el.dataset.ck].done}));
  c.querySelectorAll('[data-dck]').forEach(b=>b.onclick=e=>{e.stopPropagation();FB.remove('checklist/'+todayKey()+'/'+b.dataset.dck);});
}

// ===== BUILD INCOMING LIST =====
function showBuildIncomingList(){
  const CATS=allCats();
  let buildIncoming={};
  let activeCat=Object.keys(CATS)[0]||'confectionery';
  const o=document.createElement('div');o.className='modal-overlay';o.id='incomingModal';
  o.style.cssText='align-items:flex-start;padding:0;overflow:hidden';

  function buildHTML(){
    const checkedCount=Object.keys(buildIncoming).length;
    let tabsHtml='';
    for(const [ck,cv] of Object.entries(CATS)){
      const catItems=Object.entries(items).filter(([,i])=>i.category===ck);
      if(!catItems.length)continue;
      const cnt=catItems.filter(([id])=>buildIncoming[id]).length;
      tabsHtml+=`<button class="build-tab ${activeCat===ck?'active':''}" data-bcat="${ck}">${cv.icon} ${cv.label}${cnt>0?` <span class="pending-badge" style="background:var(--blue)">${cnt}</span>`:''}</button>`;
    }
    const catItems=Object.entries(items).filter(([,i])=>i.category===activeCat);
    let itemsHtml='';
    if(!catItems.length) itemsHtml=`<div class="empty-state">آیتمی نیست</div>`;
    else for(const [id,item] of catItems){
      const checked=buildIncoming[id];
      itemsHtml+=`<div class="smart-item ${checked?'checked':''}" data-bid="${id}">
        <div class="smart-circle">${checked?'✓':''}</div>
        <div class="smart-name">${item.name}</div>
        <div class="smart-qty">${item.quantity} ${item.unit}</div>
      </div>`;
    }
    return`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)">
      <div style="padding:16px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="font-size:16px;font-weight:800">📥 ثبت ورود جنس</div>
          <div style="font-size:12px;color:#3b82f6;font-weight:700">${checkedCount} انتخاب شده</div>
        </div>
        <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px">${tabsHtml}</div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px 16px">${itemsHtml}</div>
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
        <button id="inCan" style="flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">انصراف</button>
        <button id="inSave" style="flex:2;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:${checkedCount?'#2563eb':'#333'};color:${checkedCount?'white':'#666'}" ${!checkedCount?'disabled':''}>
          ذخیره ${checkedCount?`(${checkedCount} آیتم)`:''}
        </button>
      </div>
    </div>`;
  }

  o.innerHTML=buildHTML();
  document.body.appendChild(o);

  function rewire(){
    document.getElementById('inCan').onclick=()=>o.remove();
    document.getElementById('inSave').onclick=async()=>{
      if(!Object.keys(buildIncoming).length)return;
      const listItems={};
      for(const id of Object.keys(buildIncoming)){
        const item=items[id];
        listItems[id]={name:item.name,unit:item.unit,category:item.category,checked:true,qty:0};
      }
      await FB.push('incomingLists',{
        title:'ورود جنس '+persianDate(),
        ts:Date.now(),createdBy:currentUser?.username||'?',
        items:listItems
      });
      logActivity('ایجاد لیست ورودی',`${Object.keys(buildIncoming).length} آیتم`);
      showToast('لیست ورودی ذخیره شد ✓');o.remove();
    };
    o.querySelectorAll('[data-bcat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.bcat;o.innerHTML=buildHTML();rewire();});
    o.querySelectorAll('[data-bid]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.bid;
      if(buildIncoming[id])delete buildIncoming[id];else buildIncoming[id]=true;
      o.innerHTML=buildHTML();rewire();
    });
  }
  rewire();
}

// ===== SHOW INCOMING LIST =====
function showIncomingList(lid,mode){
  const lst=incomingLists[lid];if(!lst)return;
  const CATS=allCats();
  const listItems=lst.items||{};

  if(mode==='exec'){
    // ورود جنس — مثل exec ولی اضافه میکنه
    const toExec=Object.entries(listItems).filter(([,v])=>v.checked);
    if(!toExec.length){showToast('هیچ آیتمی انتخاب نشده','error');return;}
    const collected={};
    let step=0;
    const oe=document.createElement('div');oe.className='modal-overlay';oe.id='inExecScreen';
    oe.style.cssText='align-items:flex-start;padding:0;overflow:hidden';

    function renderStep(){
      const done=step>=toExec.length;
      if(done){
        let sumHtml='';
        for(const [id,li] of toExec){
          const qty=collected[id]||0;
          sumHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:14px">${li.name}</span>
            <span style="font-size:14px;font-weight:700;color:${qty>0?'#3b82f6':'var(--text3)'}">${qty>0?'+'+qty+' '+li.unit:'رد شد'}</span>
          </div>`;
        }
        oe.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)">
          <div style="padding:16px;border-bottom:1px solid var(--border);flex-shrink:0">
            <div style="font-size:16px;font-weight:800;color:#3b82f6;margin-bottom:4px">📥 مرور نهایی ورودی</div>
            <div style="font-size:12px;color:var(--text2)">${lst.title} — ${currentUser?.username}</div>
          </div>
          <div style="flex:1;overflow-y:auto;padding:12px 16px">${sumHtml}</div>
          <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
            <button id="inExBack" style="flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">← برگشت</button>
            <button id="inExConfirm" style="flex:2;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:#2563eb;color:white">تایید نهایی ✓</button>
          </div>
        </div>`;
        document.getElementById('inExBack').onclick=()=>{step=toExec.length-1;renderStep();};
        document.getElementById('inExConfirm').onclick=async()=>{
          document.getElementById('inExConfirm').disabled=true;
          document.getElementById('inExConfirm').textContent='در حال ثبت...';
          const execRecord={confirmedBy:currentUser?.username||'?',confirmedAt:Date.now(),date:persianDateTime(),items:{}};
          for(const [id,li] of toExec){
            const qty=collected[id]||0;
            execRecord.items[id]={name:li.name,unit:li.unit,qty};
            if(qty>0&&items[id]){
              await FB.update('items/'+id,{quantity:items[id].quantity+qty});
              await FB.push('history',{itemId:id,itemName:li.name,unit:li.unit,type:'in',qty,note:'ورود جنس: '+lst.title,user:currentUser?.username||'?',date:persianDateTime(),ts:Date.now()});
            }
          }
          const endOfDay=new Date();endOfDay.setHours(23,59,59,999);
          await FB.update('incomingLists/'+lid,{confirmed:true,confirmedBy:currentUser?.username||'?',confirmedAt:Date.now(),lockedUntil:endOfDay.getTime(),execRecord});
          logActivity('ثبت ورود جنس',`${lst.title} توسط ${currentUser?.username}`);
          showToast('ورود جنس ثبت شد ✓');
          oe.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:430px;margin:0 auto;padding:32px">
            <div style="font-size:60px;margin-bottom:16px">📥</div>
            <div style="font-size:20px;font-weight:800;margin-bottom:8px">ثبت شد!</div>
            <div style="font-size:13px;color:var(--text2);margin-bottom:32px;text-align:center">${lst.title}<br>توسط ${currentUser?.username}</div>
            <button id="inExDone" style="width:100%;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:#2563eb;color:white">بستن</button>
          </div>`;
          document.getElementById('inExDone').onclick=()=>oe.remove();
        };
        return;
      }
      const [id,li]=toExec[step];
      const item=items[id]||{quantity:0};
      const prog=Math.round((step/toExec.length)*100);
      oe.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto">
        <div style="padding:14px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:12px;color:var(--text2)">${lst.title}</div>
            <div style="font-size:12px;font-weight:700;color:#3b82f6">${step+1} از ${toExec.length}</div>
          </div>
          <div style="height:4px;background:var(--border);border-radius:4px">
            <div style="height:100%;width:${prog}%;background:#3b82f6;border-radius:4px;transition:width .3s"></div>
          </div>
        </div>
        <div style="flex:1;overflow-y:auto;padding:24px 16px 16px">
          <div style="font-size:24px;font-weight:800;margin-bottom:8px">${li.name}</div>
          <div style="font-size:13px;color:var(--text2);margin-bottom:20px">موجودی فعلی: <strong style="color:${statusColor(item)}">${item.quantity} ${li.unit}</strong></div>
          <div class="field-label">مقداری که رسیده (${li.unit})</div>
          <input class="field-input" type="number" id="inExQty" placeholder="0" inputmode="numeric"
            value="${collected[id]||''}" style="font-size:28px;padding:16px;text-align:center;margin-bottom:16px">
          <div style="display:flex;gap:8px">
            <button id="inExSkip" style="flex:1;padding:16px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">رد کردن</button>
            <button id="inExNext" style="flex:2;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:#2563eb;color:white">${step===toExec.length-1?'مرور نهایی ←':'بعدی ←'}</button>
          </div>
        </div>
      </div>`;
      const qi=document.getElementById('inExQty');qi.focus();
      document.getElementById('inExSkip').onclick=()=>{collected[id]=0;step++;renderStep();};
      document.getElementById('inExNext').onclick=()=>{collected[id]=parseFloat(qi.value)||0;step++;renderStep();};
      qi.onkeydown=e=>{if(e.key==='Enter'){collected[id]=parseFloat(qi.value)||0;step++;renderStep();}};
    }
    document.body.appendChild(oe);
    renderStep();
    return;
  }

  // View / Edit mode — same pattern as outgoing
  const localItems=JSON.parse(JSON.stringify(listItems));
  let activeViewCat=Object.keys(CATS).find(ck=>Object.values(localItems).some(i=>i.category===ck))||Object.keys(CATS)[0];
  const o=document.createElement('div');o.className='modal-overlay';o.id='inViewModal';
  o.style.cssText='align-items:flex-start;padding:0;overflow:hidden';

  function renderITabs(){
    const el=document.getElementById('ivTabs');if(!el)return;
    let h='';
    for(const [ck,cv] of Object.entries(CATS)){
      const has=Object.values(localItems).some(i=>i.category===ck);if(!has)continue;
      const cnt=Object.entries(localItems).filter(([,i])=>i.category===ck&&i.checked).length;
      const tot=Object.entries(localItems).filter(([,i])=>i.category===ck).length;
      h+=`<button class="build-tab ${activeViewCat===ck?'active':''}" data-ivcat="${ck}">${cv.icon} ${cv.label} <span style="font-size:10px;opacity:.7">${cnt}/${tot}</span></button>`;
    }
    el.innerHTML=h;
    el.querySelectorAll('[data-ivcat]').forEach(b=>b.onclick=()=>{activeViewCat=b.dataset.ivcat;renderIItems();renderITabs();});
  }

  function renderIItems(){
    const el=document.getElementById('ivItems');if(!el)return;
    const catItems=Object.entries(localItems).filter(([,i])=>i.category===activeViewCat);
    let h='';
    if(!catItems.length)h=`<div class="empty-state">آیتمی نیست</div>`;
    else for(const [id,li] of catItems){
      const stock=items[id]||{quantity:0};
      h+=`<div class="smart-item ${li.checked?'checked':''}" ${mode==='edit'?`data-ivid="${id}"`:'style="cursor:default"'}>
        <div class="smart-circle">${li.checked?'✓':''}</div>
        <div class="smart-name">${li.name}</div>
        <div style="text-align:left">
          <div class="smart-qty">${stock.quantity} ${li.unit}</div>
          ${mode==='edit'?`<div style="display:flex;gap:4px;margin-top:4px">
            <button class="item-action-btn del" style="padding:3px 8px;font-size:11px" data-ivdel="${id}">✕</button>
          </div>`:''}
        </div>
      </div>`;
    }
    el.innerHTML=h;
    if(mode==='edit'){
      el.querySelectorAll('[data-ivid]').forEach(el2=>el2.onclick=async e=>{
        if(e.target.closest('[data-ivdel]'))return;
        const id=el2.dataset.ivid;
        localItems[id].checked=!localItems[id].checked;
        await FB.update('incomingLists/'+lid+'/items/'+id,{checked:localItems[id].checked});
        el2.className=`smart-item ${localItems[id].checked?'checked':''}`;
        el2.querySelector('.smart-circle').textContent=localItems[id].checked?'✓':'';
        renderITabs();
      });
      el.querySelectorAll('[data-ivdel]').forEach(b=>b.onclick=async e=>{
        e.stopPropagation();
        const id=b.dataset.ivdel;
        await FB.remove('incomingLists/'+lid+'/items/'+id);
        delete localItems[id];
        renderIItems();renderITabs();
        showToast('حذف شد');
      });
    }
  }

  o.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)">
    <div style="padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:15px;font-weight:800">${lst.title}</div>
        <div style="font-size:11px;color:var(--text2)">${mode==='edit'?'✏️ ادیت':'👁 بازدید'} — ${lst.createdBy}</div>
      </div>
      <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px" id="ivTabs"></div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:12px 16px" id="ivItems"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
      <button id="ivClose" style="flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">بستن</button>
      ${mode==='edit'?`<button id="ivDel" style="flex:1;padding:12px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:#2d0a0a;color:#ef4444">🗑 حذف</button>`:''}
    </div>
  </div>`;
  document.body.appendChild(o);
  renderITabs();renderIItems();
  document.getElementById('ivClose').onclick=()=>o.remove();
  const ivd=document.getElementById('ivDel');
  if(ivd)ivd.onclick=async()=>{await FB.remove('incomingLists/'+lid);showToast('لیست حذف شد');o.remove();};
}

// ===== BUILD SMART LIST =====
function showBuildSmartList(){
  const CATS=allCats();
  buildingList={};
  let activeBuildCat=Object.keys(CATS)[0]||'raw';
  const o=document.createElement('div');o.className='modal-overlay';o.id='smartModal';
  o.style.cssText='align-items:flex-start;padding:0;overflow:hidden';

  function buildHTML(){
    const checkedCount=Object.keys(buildingList).length;
    // tabs
    let tabsHtml='';
    for(const [ck,cv] of Object.entries(CATS)){
      const catItems=Object.entries(items).filter(([,i])=>i.category===ck);
      if(!catItems.length)continue;
      const catChecked=catItems.filter(([id])=>buildingList[id]).length;
      tabsHtml+=`<button class="build-tab ${activeBuildCat===ck?'active':''}" data-bcat="${ck}">
        ${cv.icon} ${cv.label}${catChecked>0?` <span class="pending-badge" style="background:var(--green)">${catChecked}</span>`:''}
      </button>`;
    }
    // items for active cat
    const activeItems=Object.entries(items).filter(([,i])=>i.category===activeBuildCat);
    let itemsHtml='';
    if(!activeItems.length){
      itemsHtml=`<div class="empty-state" style="padding:24px 0">آیتمی در این دسته نیست</div>`;
    } else {
      for(const [id,item] of activeItems){
        const checked=buildingList[id];
        itemsHtml+=`<div class="smart-item ${checked?'checked':''}" data-bid="${id}">
          <div class="smart-circle">${checked?'✓':''}</div>
          <div class="smart-name">${item.name}</div>
          <div class="smart-qty">${item.quantity} ${item.unit}</div>
        </div>`;
      }
    }

    return`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)">
      <div style="padding:16px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="font-size:16px;font-weight:800">📦 ایجاد لیست انبار</div>
          <div style="font-size:12px;color:var(--green);font-weight:700">${checkedCount} انتخاب شده</div>
        </div>
        <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px" id="buildTabs">
          ${tabsHtml}
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px 16px" id="buildItems">
        ${itemsHtml}
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
        <button class="modal-btn cancel" id="smCan" style="flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">انصراف</button>
        <button class="modal-btn save" id="smSave" style="flex:2;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:${checkedCount?'var(--gold)':'#333'};color:${checkedCount?'#0f0a00':'#666'}" ${!checkedCount?'disabled':''}>
          ذخیره لیست ${checkedCount?`(${checkedCount} آیتم)`:''}
        </button>
      </div>
    </div>`;
  }

  o.innerHTML=buildHTML();
  document.body.appendChild(o);

  function rewire(){
    document.getElementById('smCan').onclick=()=>o.remove();
    document.getElementById('smSave').onclick=async()=>{
      if(!Object.keys(buildingList).length)return;
      const listItems={};
      for(const id of Object.keys(buildingList)){
        const item=items[id];
        listItems[id]={name:item.name,unit:item.unit,category:item.category,checked:true,qty:0};
      }
      await FB.push('smartLists',{
        title:'لیست '+persianDate(),
        ts:Date.now(),createdBy:currentUser?.username||'?',
        items:listItems
      });
      logActivity('ایجاد لیست انبار',`${Object.keys(buildingList).length} آیتم`);
      showToast('لیست ذخیره شد ✓');o.remove();
    };
    o.querySelectorAll('[data-bcat]').forEach(b=>b.onclick=()=>{
      activeBuildCat=b.dataset.bcat;
      o.innerHTML=buildHTML();rewire();
    });
    o.querySelectorAll('[data-bid]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.bid;
      if(buildingList[id])delete buildingList[id];else buildingList[id]=true;
      o.innerHTML=buildHTML();rewire();
    });
  }
  rewire();
}

// ===== SHOW SMART LIST =====
function showSmartList(lid,mode){
  const lst=smartLists[lid];if(!lst)return;
  const CATS=allCats();
  const listItems=lst.items||{};

  if(mode==='exec'){
    const toExec=Object.entries(listItems).filter(([,v])=>v.checked);
    if(!toExec.length){showToast('هیچ آیتمی انتخاب نشده','error');return;}
    const collected={};
    let step=0;
    const oe=document.createElement('div');oe.className='modal-overlay';oe.id='execScreen';
    oe.style.cssText='align-items:flex-start;padding:0;overflow:hidden';
    function renderExecStep(){
      const done=step>=toExec.length;
      if(done){
        let sumHtml='';
        for(const [id,li] of toExec){
          const qty=collected[id]||0;
          sumHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:14px">${li.name}</span>
            <span style="font-size:14px;font-weight:700;color:${qty>0?'var(--green)':'var(--text3)'}">${qty>0?qty+' '+li.unit:'رد شد'}</span>
          </div>`;
        }
        oe.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)">
          <div style="padding:16px;border-bottom:1px solid var(--border);flex-shrink:0">
            <div style="font-size:16px;font-weight:800;color:var(--green);margin-bottom:4px">✅ مرور نهایی</div>
            <div style="font-size:12px;color:var(--text2)">${lst.title} — ${currentUser?.username}</div>
          </div>
          <div style="flex:1;overflow-y:auto;padding:12px 16px">${sumHtml}</div>
          <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
            <button id="execBack" style="flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">← برگشت</button>
            <button id="execConfirm" style="flex:2;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--green);color:#000">تایید نهایی ✓</button>
          </div>
        </div>`;
        document.getElementById('execBack').onclick=()=>{step=toExec.length-1;renderExecStep();};
        document.getElementById('execConfirm').onclick=async()=>{
          document.getElementById('execConfirm').disabled=true;
          document.getElementById('execConfirm').textContent='در حال ثبت...';
          const execRecord={executedBy:currentUser?.username||'?',executedAt:Date.now(),date:persianDateTime(),items:{}};
          for(const [id,li] of toExec){
            const qty=collected[id]||0;
            execRecord.items[id]={name:li.name,unit:li.unit,qty};
            if(qty>0&&items[id]){
              await FB.update('items/'+id,{quantity:Math.max(0,items[id].quantity-qty)});
              await FB.push('history',{itemId:id,itemName:li.name,unit:li.unit,type:'out',qty,note:'انجام لیست: '+lst.title,user:currentUser?.username||'?',date:persianDateTime(),ts:Date.now()});
            }
          }
          const endOfDay=new Date();endOfDay.setHours(23,59,59,999);
          await FB.update('smartLists/'+lid,{executed:true,executedBy:currentUser?.username||'?',executedAt:Date.now(),lockedUntil:endOfDay.getTime(),execRecord});
          logActivity('انجام لیست انبار',`${lst.title} توسط ${currentUser?.username}`);
          showToast('لیست ثبت شد ✓');
          oe.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:430px;margin:0 auto;padding:32px">
            <div style="font-size:60px;margin-bottom:16px">✅</div>
            <div style="font-size:20px;font-weight:800;margin-bottom:8px">ثبت شد!</div>
            <div style="font-size:13px;color:var(--text2);margin-bottom:32px;text-align:center">${lst.title}<br>توسط ${currentUser?.username}</div>
            <button id="execDone" style="width:100%;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--gold);color:#0f0a00">بستن</button>
          </div>`;
          document.getElementById('execDone').onclick=()=>oe.remove();
        };
        return;
      }
      const [id,li]=toExec[step];
      const item=items[id]||{quantity:0};
      const prog=Math.round((step/toExec.length)*100);
      oe.innerHTML=`<div style="background:var(--card);width:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto">
        <div style="padding:14px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:12px;color:var(--text2)">${lst.title}</div>
            <div style="font-size:12px;font-weight:700;color:var(--gold)">${step+1} از ${toExec.length}</div>
          </div>
          <div style="height:4px;background:var(--border);border-radius:4px">
            <div style="height:100%;width:${prog}%;background:var(--gold);border-radius:4px;transition:width .3s"></div>
          </div>
        </div>
        <div style="flex:1;overflow-y:auto;padding:24px 16px 16px">
          <div style="font-size:24px;font-weight:800;margin-bottom:8px">${li.name}</div>
          <div style="font-size:13px;color:var(--text2);margin-bottom:4px">موجودی فعلی: <strong style="color:${statusColor(item)}">${item.quantity} ${li.unit}</strong></div>
          ${li.editQty?`<div style="font-size:12px;color:var(--gold);margin-bottom:20px">مقدار مورد نیاز: ${li.editQty} ${li.unit}</div>`:`<div style="margin-bottom:20px"></div>`}
          <div class="field-label">مقداری که آوردی (${li.unit})</div>
          <input class="field-input" type="number" id="execQty" placeholder="0" inputmode="numeric"
            value="${collected[id]||''}" style="font-size:28px;padding:16px;text-align:center;margin-bottom:16px">
          <div style="display:flex;gap:8px">
            <button id="execSkip" style="flex:1;padding:16px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--bg3);color:var(--text2)">رد کردن</button>
            <button id="execNext" style="flex:2;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--gold);color:#0f0a00">${step===toExec.length-1?'مرور نهایی ←':'بعدی ←'}</button>
          </div>
        </div>
      </div>`;
      const qtyInput=document.getElementById('execQty');
      qtyInput.focus();
      document.getElementById('execSkip').onclick=()=>{collected[id]=0;step++;renderExecStep();};
      document.getElementById('execNext').onclick=()=>{collected[id]=parseFloat(qtyInput.value)||0;step++;renderExecStep();};
      qtyInput.onkeydown=e=>{if(e.key==='Enter'){collected[id]=parseFloat(qtyInput.value)||0;step++;renderExecStep();}};
    }
    document.body.appendChild(oe);
    renderExecStep();
    return;
  }

  // View / Edit mode — tabbed, fast (no full rebuild on toggle)
  const o=document.createElement('div');o.className='modal-overlay';o.id='smartViewModal';
  o.style.cssText='align-items:flex-start;padding:0;overflow:hidden';

  // local copy for edit
  const localItems = JSON.parse(JSON.stringify(listItems));

  function renderViewItems(){
    const el=document.getElementById('svItems');if(!el)return;
    let h='';
    for(const [ck,cv] of Object.entries(CATS)){
      const catItems=Object.entries(localItems).filter(([,i])=>i.category===ck);
      if(!catItems.length)continue;
      h+=`<div style="font-size:12px;font-weight:700;color:var(--gold);padding:12px 0 6px">${cv.icon} ${cv.label}</div>`;
      for(const [id,li] of catItems){
        const stock=items[id]||{quantity:0};
        const isChecked=li.checked;
        if(mode==='view'){
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
            <div style="font-size:14px">${li.name}</div>
            <div style="font-size:13px;color:var(--text2)">${stock.quantity} ${li.unit}</div>
          </div>`;
        } else {
          h+=`<div class="smart-item ${isChecked?'checked':''}" id="svi-${id}" data-svid="${id}">
            <div class="smart-circle" style="background:${isChecked?'var(--green)':'transparent'};border-color:${isChecked?'var(--green)':'var(--border)'}">${isChecked?'✓':''}</div>
            <div style="flex:1">
              <div class="smart-name">${li.name}</div>
              ${li.editQty?`<div style="font-size:11px;color:var(--gold)">مقدار: ${li.editQty} ${li.unit}</div>`:''}
            </div>
            <div class="smart-qty">${stock.quantity} ${li.unit}</div>
          </div>`;
        }
      }
    }
    if(!h)h=`<div class="empty-state">آیتمی نیست</div>`;
    el.innerHTML=h;

    if(mode==='edit'){
      el.querySelectorAll('[data-svid]').forEach(el2=>el2.onclick=()=>{
        const id=el2.dataset.svid;
        localItems[id].checked=!localItems[id].checked;
        const checked=localItems[id].checked;
        el2.className=`smart-item ${checked?'checked':''}`;
        const circle=el2.querySelector('.smart-circle');

          await FB.remove('smartLists/'+lid+'/items/'+id);

      logActivity('ادیت لیست',lst.title);

        itemsH+=`<div class="smart-item" data-addid="${id}">

          <div class="smart-name">${item.name}</div>
          <div class="smart-qty">${item.quantity} ${item.unit}</div>

function renderAdminHistory(){
  const c=document.getElementById('adminContent');if(!c)return;
  let f=[...history];
  if(adminFilter.type!=='all')f=f.filter(h=>h.type===adminFilter.type);
  if(adminFilter.search){const s=adminFilter.search.toLowerCase();f=f.filter(h=>h.itemName?.toLowerCase().includes(s)||h.note?.toLowerCase().includes(s));}
  if(adminFilter.from)f=f.filter(h=>h.ts>=new Date(adminFilter.from).getTime());
  if(adminFilter.to)f=f.filter(h=>h.ts<=new Date(adminFilter.to).getTime()+86400000);
  let html=`<div class="admin-filters">
    <input class="admin-search" type="text" id="aS" value="${adminFilter.search}" placeholder="🔍 جستجو...">
    <div class="admin-filter-row">
      <input class="date-input" type="date" id="aF" value="${adminFilter.from}">
      <input class="date-input" type="date" id="aT" value="${adminFilter.to}">
    </div>
    <div class="admin-type-filter">
      <button class="atype-btn ${adminFilter.type==='all'?'active':''}" data-at="all">همه</button>
      <button class="atype-btn ${adminFilter.type==='in'?'active':''}" data-at="in">✅ ورود</button>
      <button class="atype-btn ${adminFilter.type==='out'?'active':''}" data-at="out">❌ خروج</button>
    </div>
  </div>
  <div class="admin-summary">
    <div class="summary-card"><div class="summary-num" style="color:var(--green)">${f.filter(h=>h.type==='in').length}</div><div class="summary-label">تعداد ورود</div></div>
    <div class="summary-card"><div class="summary-num" style="color:var(--red)">${f.filter(h=>h.type==='out').length}</div><div class="summary-label">تعداد خروج</div></div>
  </div>`;
  if(!f.length)html+=`<div class="empty-state">تراکنشی پیدا نشد</div>`;
  else{
    const byDate={};
    f.forEach(h=>{const d=h.date?.split('،')[0]||'—';if(!byDate[d])byDate[d]=[];byDate[d].push(h);});
    for(const [date,txs] of Object.entries(byDate)){
      html+=`<div style="font-size:12px;color:var(--gold);margin:14px 0 8px;font-weight:700">📅 ${date}</div>`;
      for(const h of txs)
        html+=`<div class="admin-item"><div class="admin-item-top"><div class="admin-item-name">${h.itemName}</div><div class="admin-item-delta" style="color:${h.type==='in'?'#22c55e':'#ef4444'}">${h.type==='in'?'+':'-'}${h.qty} ${h.unit||''}</div></div>
          <div class="admin-item-meta"><span class="badge ${h.type}">${h.type==='in'?'ورود':'خروج'}</span><span>${h.date}</span>${h.user?`<span>👤 ${h.user}</span>`:''}</div>
          ${h.note?`<div class="admin-item-note">📝 ${h.note}</div>`:''}</div>`;
    }
  }
  c.innerHTML=html;
  document.getElementById('aS').oninput=e=>{adminFilter.search=e.target.value;renderAdminHistory();};
  document.getElementById('aF').onchange=e=>{adminFilter.from=e.target.value;renderAdminHistory();};
  document.getElementById('aT').onchange=e=>{adminFilter.to=e.target.value;renderAdminHistory();};
  c.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{adminFilter.type=b.dataset.at;renderAdminHistory();});
}

async function renderActivityLog(){
  const c=document.getElementById('adminContent');if(!c)return;
  c.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  const raw=await FB.get('activityLog')||{};
  const logs=Object.entries(raw).map(([k,v])=>({...v,_key:k})).sort((a,b)=>b.ts-a.ts);
  let html=`<div style="font-size:12px;color:var(--text2);margin-bottom:12px">تمام فعالیت‌های کاربران</div>`;
  if(!logs.length)html+=`<div class="empty-state">فعالیتی ثبت نشده</div>`;
  else{
    const byDate={};
    logs.forEach(l=>{const d=l.date?.split('،')[0]||'—';if(!byDate[d])byDate[d]=[];byDate[d].push(l);});
    for(const [date,ls] of Object.entries(byDate)){
      html+=`<div style="font-size:12px;color:var(--gold);margin:14px 0 8px;font-weight:700">📅 ${date}</div>`;
      for(const l of ls)
        html+=`<div class="admin-item">
          <div class="admin-item-top">
            <div class="admin-item-name">${l.action}</div>
            <span style="font-size:11px;color:var(--text2)">👤 ${l.user}</span>
          </div>
          <div class="admin-item-meta"><span>${l.date}</span></div>
          ${l.detail?`<div class="admin-item-note">📝 ${l.detail}</div>`:''}
        </div>`;
    }
  }
  c.innerHTML=html;
}

function renderAdminUsers(){
  const c=document.getElementById('adminContent');if(!c)return;
  const all=Object.entries(users);
  const filtered=usersFilter==='all'?all:all.filter(([,u])=>u.status===usersFilter);
  let html=`<div class="users-filter">
    <button class="ufilter-btn ${usersFilter==='all'?'active':''}" data-uf="all">همه (${all.length})</button>
    <button class="ufilter-btn ${usersFilter==='pending'?'active':''}" data-uf="pending">⏳ در انتظار</button>
    <button class="ufilter-btn ${usersFilter==='active'?'active':''}" data-uf="active">✅ فعال</button>
    <button class="ufilter-btn ${usersFilter==='disabled'?'active':''}" data-uf="disabled">⛔ غیرفعال</button>
  </div>`;
  if(!filtered.length)html+=`<div class="empty-state">کاربری پیدا نشد</div>`;
  else for(const [uname,udata] of filtered){
    const sl=udata.status==='pending'?'در انتظار':udata.status==='active'?'فعال':'غیرفعال';
    const rd=udata.createdAt?persianDate(udata.createdAt):'—';
    html+=`<div class="user-card"><div class="user-card-top"><div class="user-name-big">👤 ${uname}</div><span class="ubadge ${udata.status}">${sl}</span></div>
      <div class="user-meta">ثبت‌نام: ${rd}</div>
      <div class="user-actions">
        ${udata.status==='pending'?`<button class="user-action-btn approve" data-ap="${uname}">✅ تایید</button><button class="user-action-btn deactivate" data-rj="${uname}">❌ رد</button>`:''}
        ${udata.status==='active'?`<button class="user-action-btn deactivate" data-dv="${uname}">⛔ غیرفعال</button>`:''}
        ${udata.status==='disabled'?`<button class="user-action-btn reactivate" data-rv="${uname}">🔄 فعال کردن</button>`:''}
      </div></div>`;
  }
  c.innerHTML=html;
  c.querySelectorAll('[data-uf]').forEach(b=>b.onclick=()=>{usersFilter=b.dataset.uf;renderAdminUsers();});
  c.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{FB.update('users/'+b.dataset.ap,{status:'active'});logActivity('تایید کاربر',b.dataset.ap);showToast(b.dataset.ap+' تایید شد ✓');});
  c.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{FB.update('users/'+b.dataset.rj,{status:'disabled'});logActivity('رد کاربر',b.dataset.rj);showToast(b.dataset.rj+' رد شد');});
  c.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>{FB.update('users/'+b.dataset.dv,{status:'disabled'});logActivity('غیرفعال کردن کاربر',b.dataset.dv);showToast(b.dataset.dv+' غیرفعال شد');});
  c.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{FB.update('users/'+b.dataset.rv,{status:'active'});logActivity('فعال کردن کاربر',b.dataset.rv);showToast(b.dataset.rv+' فعال شد ✓');});
}

wireAuth();
</script>
